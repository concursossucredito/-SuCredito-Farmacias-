<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sucrédito · Farmacias</title>

  <style>
    :root{
      --yellow:#FFEE00;
      --ink:#1B1A1E;
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:#fff;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      overflow-x:hidden;
    }

    /* Banner superior amarillo */
    .top-banner{
      width:100%;
      height:82px;
      background:var(--yellow);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px 24px;
    }

    .top-banner img{
      display:block;
      width:auto;
      height:52px;
      max-width:80%;
      object-fit:contain;
    }

    /* Hero: se muestra completo, sin recorte ni deformación */
    .hero{
      width:100%;
      margin:0;
      padding:0;
      line-height:0;
      background:#fff;
    }

    .hero-image{
      display:block;
      width:100%;
      height:auto;
      max-width:none;
      object-fit:contain;
      object-position:center;
      image-rendering:auto;
    }

    @media (max-width:600px){
      .top-banner{
        height:68px;
        padding:10px 18px;
      }

      .top-banner img{
        height:42px;
        max-width:85%;
      }

      .hero-image{
        width:100%;
        height:auto;
      }
    }
  </style>
</head>

<body>

  <!-- Banner superior amarillo con logo -->
  <header class="top-banner">
    <img src="logo.png" alt="Tarjeta Sucrédito">
  </header>

  <!-- ÚNICO contenido visual: hero completo -->
  <main class="hero">
    <img
      src="hero.jpg"
      alt="Promoción Sucrédito - Farmacia favorita"
      class="hero-image"
    >
  </main>

</body>
</html>
